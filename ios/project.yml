# XcodeGen 설정. Mac에서 `xcodegen generate` 를 실행하면 GrammarCards.xcodeproj 가 생성된다.
name: GrammarCards
options:
  bundleIdPrefix: com.journewki
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  GrammarCards:
    type: application
    platform: iOS
    sources:
      - path: GrammarCards
      # 카드 데이터 (저장소 루트의 data/ 를 그대로 번들에 포함)
      - path: ../data/n5.json
        buildPhase: resources
      - path: ../data/n4.json
        buildPhase: resources
      - path: ../data/n3.json
        buildPhase: resources
      - path: ../data/n2.json
        buildPhase: resources
      - path: ../data/n1.json
        buildPhase: resources
      # Apple 개인정보 매니페스트 (UserDefaults 사용 사유)
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        # 표준 HTTPS 외 암호화 사용 안 함 → 업로드 때마다 수출 규정 질문 생략
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.journewki.grammarcards
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JLPT 문법카드
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GrammarCardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GrammarCardsTests
    dependencies:
      - target: GrammarCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GrammarCards:
    build:
      targets:
        GrammarCards: all
    run:
      # 시뮬레이터에서 App Store Connect 없이 결제 테스트
      storeKitConfiguration: Products.storekit
    test:
      targets:
        - GrammarCardsTests
