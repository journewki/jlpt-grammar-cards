# XcodeGen 설정. Mac에서 `xcodegen generate` 를 실행하면 GrammarCards.xcodeproj 가 생성된다.
name: GrammarCards
options:
  bundleIdPrefix: com.journewki
  deploymentTarget:
    iOS: "17.0"
# Personal: 개발자 본인용 빌드 (모든 기능 잠금 해제, 버전 99.0). 절대 심사에 제출하지 않는다.
configs:
  Debug: debug
  Release: release
  Personal: release
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
  configs:
    Personal:
      # 버전을 99.0 으로 달아 출시 버전(1.x)에 실수로 붙지 않게 한다
      MARKETING_VERSION: "99.0"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: PERSONAL_UNLOCK
targets:
  GrammarCards:
    type: application
    platform: iOS
    sources:
      - path: GrammarCards
      # 카드 데이터 (저장소 루트의 data/ 를 그대로 번들에 포함)
      - path: ../data/n5.json
        buildPhase: resources
      - path: ../data/n4.json
        buildPhase: resources
      - path: ../data/n3.json
        buildPhase: resources
      - path: ../data/n2.json
        buildPhase: resources
      - path: ../data/n1.json
        buildPhase: resources
      - path: ../data/daily.json
        buildPhase: resources
      # Apple 개인정보 매니페스트 (UserDefaults 사용 사유)
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        # 표준 HTTPS 외 암호화 사용 안 함 → 업로드 때마다 수출 규정 질문 생략
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.journewki.grammarcards
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JLPT 문법카드
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "V3WF6CVKJ9"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 서명: 자동 서명을 끄고 실기기 빌드는 배포용(App Store) 프로파일로 수동 서명.
        # 자동 서명은 등록된 기기가 없으면 "Your team has no devices" 에러가 나기 때문.
        # 시뮬레이터 빌드는 프로파일이 필요 없다.
        # 프로파일: developer.apple.com → Profiles → App Store Connect, 이름 "GrammarCards App Store"
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": GrammarCards App Store
  GrammarCardsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GrammarCardsTests
    dependencies:
      - target: GrammarCards
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # 테스트는 시뮬레이터에서만 실행 → 실기기 서명 불필요 (기기 없음 에러 방지)
        CODE_SIGN_STYLE: Manual
        "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": NO
schemes:
  GrammarCards:
    build:
      targets:
        GrammarCards: all
    run:
      # 시뮬레이터에서 App Store Connect 없이 결제 테스트
      storeKitConfiguration: Products.storekit
    test:
      targets:
        - GrammarCardsTests
  # 개인용(전부 잠금 해제) 빌드: 이 스킴으로 Archive → TestFlight 내부 테스트에서만 사용
  GrammarCards-Personal:
    build:
      targets:
        GrammarCards: all
    run:
      config: Personal
    archive:
      config: Personal
